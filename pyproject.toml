[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbam-tvi"
version = "1.0.0"
description = "Iran's export vulnerability to the EU Carbon Border Adjustment Mechanism (TVI-CBAM)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.1", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
cbam-tvi = "cbam_tvi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
